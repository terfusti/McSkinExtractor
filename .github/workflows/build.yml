
name: Build McSkinExtractor

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Give Gradle permission to execute
        run: chmod +x gradlew

      - name: Build mod
        run: ./gradlew build --no-daemon

      - name: Find release JAR
        if: startsWith(github.ref, 'refs/tags/v')
        id: jar
        shell: bash
        run: |
          find build/libs -maxdepth 1 -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            ! -name '*-plain.jar' > jars.txt

          cat jars.txt

          if [ "$(wc -l < jars.txt)" -ne 1 ]; then
            echo "Expected exactly one release JAR"
            exit 1
          fi

          echo "path=$(cat jars.txt)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.jar.outputs.path }}" \
            --verify-tag \
            --generate-notes \
            --title "McSkinExtractor ${GITHUB_REF_NAME}"
